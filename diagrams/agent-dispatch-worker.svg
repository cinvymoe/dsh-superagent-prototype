<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-dispatch-worker-title agent-dispatch-worker-desc" id="agent-dispatch-worker-root">
        <title id="agent-dispatch-worker-title">一个调度 Agent，多个 Worker Agent</title>
        <desc id="agent-dispatch-worker-desc">Agent 协作拓扑：Human 或 Source 触发 Engine，Engine 把候选交给 Dispatcher Agent 决策，再由 Engine 派工给每个 Ticket 一个的 Worker Agent；Worker 的回报与提问经 Engine 异步转回 Dispatcher。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #agent-dispatch-worker-root { --color-paper: #f5f5f5; --color-paper-2: #ececec;
      --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #5a6580;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #agent-dispatch-worker-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agent-dispatch-worker-root .container { max-width: 1360px; margin: 0 auto; }
      #agent-dispatch-worker-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #agent-dispatch-worker-root .subtitle { font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 72ch; }
      #agent-dispatch-worker-root .diagram-container { background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.25rem;
      overflow-x: auto; }
      #agent-dispatch-worker-root .d-tag { font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #agent-dispatch-worker-root .d-name { font-family: var(--font-sans); font-size: 12px; font-weight: 600; }
      #agent-dispatch-worker-root .d-sub { font-family: var(--font-sans); font-size: 12px; }
      #agent-dispatch-worker-root .d-mono { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; }
      #agent-dispatch-worker-root .d-label { font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
      #agent-dispatch-worker-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.85rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid rgba(45,49,66,0.08); }
      #agent-dispatch-worker-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      #agent-dispatch-worker-root .card-dot.coral { background: var(--color-accent); }
      #agent-dispatch-worker-root .card-dot.muted { background: var(--color-muted); }
      #agent-dispatch-worker-root .card-dot.ink { background: var(--color-ink); }
      @media print {
#agent-dispatch-worker-root .diagram-container { overflow-x: visible; background: transparent; border: 0; padding: 0; }
}</style>
          <marker id="agent-dispatch-worker-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="agent-dispatch-worker-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="agent-dispatch-worker-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- Connectors first: z-order keeps lines behind the boxes -->
        <line x1="288" y1="234" x2="376" y2="234" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#agent-dispatch-worker-arrow-link)"/>
        <line x1="680" y1="196" x2="800" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-dispatch-worker-arrow)"/>
        <line x1="800" y1="252" x2="680" y2="252" stroke="#bf4520" stroke-width="1.4" marker-end="url(#agent-dispatch-worker-arrow-accent)"/>
        <line x1="680" y1="472" x2="752" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-dispatch-worker-arrow)"/>
        <line x1="752" y1="508" x2="680" y2="508" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-dispatch-worker-arrow)"/>
        <path d="M 680,340 H 880 V 288" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#agent-dispatch-worker-arrow)"/>
        <path d="M 376,540 H 200 V 284" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#agent-dispatch-worker-arrow-link)"/>
        <path d="M 172,284 V 604 H 900 V 576" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#agent-dispatch-worker-arrow)"/>

        <!-- Arrow labels: opaque masks, 8px above the horizontal stroke -->
        <rect x="312" y="210" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="332" y="222" class="d-label" fill="#2e5aa8" text-anchor="middle">触发</text>

        <rect x="720" y="172" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="744" y="184" class="d-label" fill="#4f5d75" text-anchor="middle">候选卡</text>

        <rect x="720" y="228" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="740" y="240" class="d-label" fill="#bf4520" text-anchor="middle">决策</text>

        <rect x="700" y="448" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="720" y="460" class="d-label" fill="#4f5d75" text-anchor="middle">派工</text>

        <rect x="700" y="484" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="720" y="496" class="d-label" fill="#4f5d75" text-anchor="middle">回报</text>

        <rect x="744" y="316" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="784" y="328" class="d-label" fill="#5a6580" text-anchor="middle">报告 / 提问</text>

        <rect x="260" y="516" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="304" y="528" class="d-label" fill="#2e5aa8" text-anchor="middle">Outbox 回复</text>

        <rect x="448" y="580" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="480" y="592" class="d-label" fill="#5a6580" text-anchor="middle">订阅直达</text>

        <!-- Node: Human / Source -->
        <rect x="56" y="184" width="232" height="100" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="184" width="232" height="100" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="64" y="196" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="88" y="205" class="d-tag" fill="#5a6580" text-anchor="middle">INPUT</text>
        <text x="172" y="236" class="d-name" fill="#2d3142" text-anchor="middle">Human / Source</text>
        <text x="172" y="256" class="d-sub" fill="#4f5d75" text-anchor="middle">GitHub · 飞书</text>
        <text x="172" y="274" class="d-sub" fill="#5a6580" text-anchor="middle">Issue · PR 评论 · 聊天</text>

        <!-- Node: Engine -->
        <rect x="376" y="128" width="304" height="432" rx="6" fill="#f5f5f5"/>
        <rect x="376" y="128" width="304" height="432" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="392" y="144" width="56" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="420" y="153" class="d-tag" fill="#5a6580" text-anchor="middle">BROKER</text>

        <text x="408" y="190" class="d-name" fill="#2d3142">Engine</text>
        <text x="408" y="212" class="d-sub" fill="#4f5d75">唯一状态写入者</text>
        <line x1="408" y1="234" x2="664" y2="234" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>

        <text x="408" y="268" class="d-mono" fill="#5a6580" letter-spacing="0.06em">INTAKE</text>
        <text x="504" y="268" class="d-sub" fill="#2d3142">Trigger 去重</text>
        <line x1="408" y1="292" x2="664" y2="292" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>

        <text x="408" y="328" class="d-mono" fill="#5a6580" letter-spacing="0.06em">EVAL</text>
        <text x="504" y="328" class="d-sub" fill="#2d3142">Gate 准入 + 研判</text>
        <line x1="408" y1="352" x2="664" y2="352" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>

        <text x="408" y="388" class="d-mono" fill="#5a6580" letter-spacing="0.06em">TICKET</text>
        <text x="504" y="388" class="d-sub" fill="#2d3142">Mandate + 派工</text>
        <line x1="408" y1="412" x2="664" y2="412" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>

        <text x="408" y="448" class="d-mono" fill="#5a6580" letter-spacing="0.06em">EFFECTS</text>
        <text x="504" y="448" class="d-sub" fill="#2d3142">launch · relay · reply</text>
        <line x1="408" y1="472" x2="664" y2="472" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>

        <text x="408" y="508" class="d-sub" fill="#4f5d75">SQLite · 持久化</text>
        <text x="408" y="528" class="d-sub" fill="#5a6580">Router / Worker 不直接改状态</text>

        <!-- Node: Dispatcher Agent (focal) -->
        <rect x="800" y="144" width="392" height="144" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="144" width="392" height="144" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="816" y="156" width="64" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="848" y="165" class="d-tag" fill="#bf4520" text-anchor="middle">DISPATCHER</text>

        <text x="996" y="200" class="d-name" fill="#2d3142" text-anchor="middle">Dispatcher Agent</text>
        <text x="996" y="222" class="d-sub" fill="#4f5d75" text-anchor="middle">Router / 主 Session · 调度</text>
        <text x="996" y="244" class="d-sub" fill="#5a6580" text-anchor="middle">研判 · 路由 · 对外沟通</text>
        <text x="996" y="264" class="d-mono" fill="#5a6580" text-anchor="middle">14 tools · 5s</text>

        <!-- Zone: Worker Agents -->
        <rect x="752" y="392" width="472" height="184" rx="6" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.18"/>
        <text x="768" y="414" class="d-tag" fill="#5a6580" letter-spacing="0.10em">EXECUTION ZONE</text>
        <text x="864" y="414" class="d-sub" fill="#5a6580">每个 Ticket 一个持久 Session</text>

        <!-- Worker cards -->
        <rect x="768" y="436" width="136" height="100" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="436" width="136" height="100" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="780" y="454" class="d-tag" fill="#5a6580" letter-spacing="0.08em">WORKER</text>
        <text x="836" y="482" class="d-name" fill="#2d3142" text-anchor="middle">Worker A</text>
        <text x="836" y="502" class="d-mono" fill="#5a6580" text-anchor="middle">worker-t101</text>
        <text x="836" y="522" class="d-sub" fill="#4f5d75" text-anchor="middle">Ticket 101</text>

        <rect x="920" y="436" width="136" height="100" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="436" width="136" height="100" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="932" y="454" class="d-tag" fill="#5a6580" letter-spacing="0.08em">WORKER</text>
        <text x="988" y="482" class="d-name" fill="#2d3142" text-anchor="middle">Worker B</text>
        <text x="988" y="502" class="d-mono" fill="#5a6580" text-anchor="middle">worker-t102</text>
        <text x="988" y="522" class="d-sub" fill="#4f5d75" text-anchor="middle">Ticket 102</text>

        <rect x="1072" y="436" width="136" height="100" rx="6" fill="#f5f5f5"/>
        <rect x="1072" y="436" width="136" height="100" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="1084" y="454" class="d-tag" fill="#5a6580" letter-spacing="0.08em">WORKER</text>
        <text x="1140" y="482" class="d-name" fill="#2d3142" text-anchor="middle">Worker C</text>
        <text x="1140" y="502" class="d-mono" fill="#5a6580" text-anchor="middle">worker-t103</text>
        <text x="1140" y="522" class="d-sub" fill="#4f5d75" text-anchor="middle">Ticket 103</text>

        <text x="768" y="558" class="d-sub" fill="#4f5d75">maxWorkers 3（1–16）+ 1 个人工插槽</text>

        <!-- Legend strip -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="675" class="d-tag" fill="#4f5d75" letter-spacing="0.14em">LEGEND</text>

        <line x1="140" y1="671" x2="164" y2="671" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="172" y="675" class="d-label" fill="#4f5d75">调用 / 派工</text>

        <line x1="300" y1="671" x2="324" y2="671" stroke="#bf4520" stroke-width="1.4"/>
        <text x="332" y="675" class="d-label" fill="#bf4520">决策动作</text>

        <line x1="460" y1="671" x2="484" y2="671" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="492" y="675" class="d-label" fill="#5a6580">异步回传 / 直达</text>

        <text x="700" y="675" class="d-label" fill="#4f5d75">Router 与 Worker 不直接对话：Engine 负责持久化与转交</text>
      </svg>
