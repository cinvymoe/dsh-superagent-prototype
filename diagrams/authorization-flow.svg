<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authorization-flow-title authorization-flow-desc" id="authorization-flow-root">
        <title id="authorization-flow-title">一条 Trigger 的两条去向：订阅扇出与 Eval 授权</title>
        <desc id="authorization-flow-desc">授权流程图：Trigger 到达后，被 Ticket 拥有的消息交给 Executor 处理或交回，其余消息经 Gate 判定强度、Eval 评估、Decision 决定，仅 accept 创建新的 Ticket 与 Mandate。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #authorization-flow-root { --color-paper: #f5f5f5; --color-paper-2: #ececec;
      --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #5a6580;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #authorization-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #authorization-flow-root .container { max-width: 1360px; margin: 0 auto; }
      #authorization-flow-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #authorization-flow-root .subtitle { font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 80ch; }
      #authorization-flow-root .diagram-container { width: 100%;
      overflow-x: auto;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.25rem; }
      #authorization-flow-root .d-tag { font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #authorization-flow-root .d-name { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
      #authorization-flow-root .d-sub { font-family: var(--font-sans); font-size: 12px; }
      #authorization-flow-root .d-mono { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; }
      #authorization-flow-root .d-arrow { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; }
      #authorization-flow-root .d-label { font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
      #authorization-flow-root .d-annot { font-family: var(--font-serif); font-style: italic; font-size: 14px; }
      #authorization-flow-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(45,49,66,0.08); }
      #authorization-flow-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      #authorization-flow-root .card-dot.coral { background: var(--color-accent); }
      #authorization-flow-root .card-dot.muted { background: var(--color-muted); }
      #authorization-flow-root .card-dot.ink { background: var(--color-ink); }
      @media print {
#authorization-flow-root .diagram-container { overflow-x: visible; background: transparent; border: 0; padding: 0; }
}</style>
          <marker id="authorization-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="authorization-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="authorization-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- ============ connectors ============ -->
        <line x1="640" y1="156" x2="640" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-flow-arrow)"/>
        <line x1="544" y1="220" x2="440" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-flow-arrow)"/>
        <line x1="640" y1="264" x2="640" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-flow-arrow)"/>
        <path d="M 200,220 H 184 Q 176,220 176,228 V 428 Q 176,436 184,436 H 480"
              fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#authorization-flow-arrow)"/>
        <line x1="640" y1="384" x2="640" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-flow-arrow)"/>
        <line x1="640" y1="504" x2="640" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-flow-arrow)"/>
        <line x1="736" y1="564" x2="880" y2="564" stroke="#bf4520" stroke-width="1.4" marker-end="url(#authorization-flow-arrow-accent)"/>
        <line x1="544" y1="564" x2="440" y2="564" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-flow-arrow)"/>
        <line x1="1040" y1="264" x2="1040" y2="516" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#authorization-flow-arrow)"/>
        <path d="M 800,116 H 840 Q 848,116 848,124 V 212 Q 848,220 856,220 H 880"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-flow-arrow)"/>

        <!-- ============ arrow labels ============ -->
        <rect x="472" y="196" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="484" y="208" class="d-label" fill="#4f5d75" text-anchor="middle">是</text>

        <rect x="648" y="272" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="660" y="284" class="d-label" fill="#4f5d75" text-anchor="middle">否</text>

        <rect x="192" y="336" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="212" y="348" class="d-label" fill="#5a6580" text-anchor="middle">交回</text>

        <rect x="648" y="392" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="668" y="404" class="d-label" fill="#4f5d75" text-anchor="middle">候选</text>

        <rect x="788" y="540" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="808" y="552" class="d-arrow" fill="#bf4520" text-anchor="middle">ACCEPT</text>

        <rect x="452" y="540" width="72" height="16" rx="2" fill="#f5f5f5"/>
        <text x="488" y="552" class="d-label" fill="#4f5d75" text-anchor="middle">其余结果</text>

        <rect x="1048" y="372" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1068" y="384" class="d-arrow" fill="#5a6580" text-anchor="middle">INPUT</text>

        <rect x="800" y="168" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="820" y="180" class="d-label" fill="#4f5d75" text-anchor="middle">扇出</text>

        <!-- ============ nodes ============ -->

        <!-- Trigger -->
        <rect x="480" y="80" width="320" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="80" width="320" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="488" y="90" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="512" y="99" class="d-tag" fill="#5a6580" text-anchor="middle">SOURCE</text>
        <text x="496" y="128" class="d-name" fill="#2d3142">Trigger 到达</text>
        <text x="600" y="128" class="d-sub" fill="#4f5d75">mention · direct · 普通消息</text>

        <!-- D1: owned? -->
        <polygon points="544,220 640,176 736,220 640,264" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="216" class="d-name" fill="#2d3142" text-anchor="middle">这条消息已被</text>
        <text x="640" y="234" class="d-name" fill="#2d3142" text-anchor="middle">Ticket 拥有？</text>

        <!-- Executor owns it -->
        <rect x="200" y="176" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="176" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="208" y="186" width="60" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="238" y="195" class="d-tag" fill="#5a6580" text-anchor="middle">EXECUTOR</text>
        <text x="216" y="218" class="d-name" fill="#2d3142">Executor 拥有这条消息</text>
        <text x="216" y="238" class="d-sub" fill="#4f5d75">范围内处理，越界交回</text>
        <text x="216" y="256" class="d-sub" fill="#5a6580">交回后才进 Eval</text>

        <!-- Gate -->
        <rect x="480" y="296" width="320" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="296" width="320" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="488" y="306" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="506" y="315" class="d-tag" fill="#5a6580" text-anchor="middle">GATE</text>
        <text x="496" y="336" class="d-name" fill="#2d3142">Gate 准入 → 强度</text>
        <text x="496" y="356" class="d-sub" fill="#4f5d75">允许名单 · 准入表 · bot 名单</text>
        <text x="496" y="374" class="d-mono" fill="#5a6580">explicit · inferred · not admitted</text>

        <!-- Eval -->
        <rect x="480" y="416" width="320" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="416" width="320" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="488" y="426" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="506" y="435" class="d-tag" fill="#5a6580" text-anchor="middle">EVAL</text>
        <text x="496" y="456" class="d-name" fill="#2d3142">Eval · Assessment</text>
        <text x="496" y="476" class="d-sub" fill="#4f5d75">每条启用规则判一次</text>
        <text x="496" y="494" class="d-mono" fill="#5a6580">accept mode: off · observe · auto</text>

        <!-- D2: decision -->
        <polygon points="544,564 640,520 736,564 640,608" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="560" class="d-name" fill="#2d3142" text-anchor="middle">Decision</text>
        <text x="640" y="578" class="d-mono" fill="#5a6580" text-anchor="middle">accept?</text>

        <!-- Recorded outcomes -->
        <rect x="200" y="516" width="240" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="516" width="240" height="96" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="208" y="526" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="232" y="535" class="d-tag" fill="#5a6580" text-anchor="middle">RECORD</text>
        <text x="216" y="560" class="d-name" fill="#2d3142">记录 Decision</text>
        <text x="216" y="580" class="d-mono" fill="#4f5d75">stop · ignore · unavailable</text>
        <text x="216" y="600" class="d-sub" fill="#5a6580">不建 Ticket，不动已有 Mandate</text>

        <!-- New ticket (focal) -->
        <rect x="880" y="516" width="320" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="880" y="516" width="320" height="96" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="896" y="526" width="104" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="948" y="535" class="d-tag" fill="#bf4520" text-anchor="middle">TICKET · MANDATE</text>
        <text x="904" y="560" class="d-name" fill="#2d3142">新的 Ticket + Mandate</text>
        <text x="904" y="580" class="d-mono" fill="#4f5d75">policyVersion · scope · matched rules</text>
        <text x="904" y="600" class="d-sub" fill="#2d3142">唯一能新建授权的出口</text>

        <!-- Subscription fan-out -->
        <rect x="880" y="176" width="320" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="880" y="176" width="320" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="888" y="186" width="76" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="926" y="195" class="d-tag" fill="#5a6580" text-anchor="middle">SUBSCRIPTION</text>
        <text x="896" y="218" class="d-name" fill="#2d3142">订阅扇出</text>
        <text x="896" y="238" class="d-sub" fill="#4f5d75">作为上下文 Input，不给新授权</text>
        <text x="896" y="256" class="d-sub" fill="#5a6580">ended 的 Ticket 只被人消息唤醒</text>

        <!-- annotation -->
        <text x="640" y="640" class="d-annot" fill="#bf4520" text-anchor="middle">订阅只带上下文；授权只从 accept 出生。</text>

        <!-- ============ legend strip ============ -->
        <line x1="40" y1="660" x2="1240" y2="660" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="684" class="d-tag" fill="#4f5d75" letter-spacing="0.14em">LEGEND</text>
        <polygon points="96,676 116,668 136,676 116,684" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="680" class="d-sub" fill="#4f5d75">判定</text>
        <line x1="216" y1="676" x2="244" y2="676" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authorization-flow-arrow)"/>
        <text x="252" y="680" class="d-sub" fill="#4f5d75">判定路径</text>
        <line x1="372" y1="676" x2="400" y2="676" stroke="#5a6580" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="408" y="680" class="d-sub" fill="#4f5d75">上下文 / 交回：不带授权</text>
        <rect x="620" y="670" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="648" y="680" class="d-sub" fill="#4f5d75">处理节点</text>
        <rect x="756" y="670" width="20" height="12" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="784" y="680" class="d-sub" fill="#4f5d75">新建授权</text>
        <text x="1240" y="680" class="d-mono" fill="#5a6580" text-anchor="end">docs/002-authorization.md</text>
      </svg>
