<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concurrency-queue-title concurrency-queue-desc" id="concurrency-queue-root">
        <title id="concurrency-queue-title">并发与排队：三类来源、有限槽位与人的插队槽</title>
        <desc id="concurrency-queue-desc">数据流图：新工单、订阅与 CI 的 Input、人的消息汇入等待队列，执行工单按 maxWorkers 的槽位派给 Executor，对齐工单走独立的两个 aligner 槽，人的消息可用一个额外插队槽，依赖未结束的 slice 不占槽，讨论提问走独立的两个 Answerer 槽。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #concurrency-queue-root { --color-paper: #f5f5f5; --color-paper-2: #ececec;
      --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #5a6580;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #concurrency-queue-root { font-family: var(--font-sans); color: var(--color-ink); }
      #concurrency-queue-root .container { max-width: 1360px; margin: 0 auto; }
      #concurrency-queue-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #concurrency-queue-root .subtitle { font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 80ch; }
      #concurrency-queue-root .diagram-container { width: 100%;
      overflow-x: auto;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.25rem; }
      #concurrency-queue-root .d-tag { font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #concurrency-queue-root .d-name { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
      #concurrency-queue-root .d-sub { font-family: var(--font-sans); font-size: 12px; }
      #concurrency-queue-root .d-mono { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; }
      #concurrency-queue-root .d-arrow { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; }
      #concurrency-queue-root .d-label { font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
      #concurrency-queue-root .d-annot { font-family: var(--font-serif); font-style: italic; font-size: 14px; }
      #concurrency-queue-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(45,49,66,0.08); }
      #concurrency-queue-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      #concurrency-queue-root .card-dot.coral { background: var(--color-accent); }
      #concurrency-queue-root .card-dot.muted { background: var(--color-muted); }
      #concurrency-queue-root .card-dot.ink { background: var(--color-ink); }
      @media print {
#concurrency-queue-root .diagram-container { overflow-x: visible; background: transparent; border: 0; padding: 0; }
}</style>
          <marker id="concurrency-queue-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="concurrency-queue-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="concurrency-queue-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- ============ paths ============ -->
        <path d="M 304,176 H 336 Q 344,176 344,184 V 196 Q 344,204 352,204 H 360"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concurrency-queue-arrow)"/>
        <line x1="304" y1="268" x2="360" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concurrency-queue-arrow)"/>
        <line x1="304" y1="360" x2="360" y2="360" stroke="#bf4520" stroke-width="1.4" marker-end="url(#concurrency-queue-arrow-accent)"/>
        <line x1="640" y1="240" x2="700" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concurrency-queue-arrow)"/>
        <path d="M 600,420 V 532 Q 600,540 608,540 H 700"
              fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#concurrency-queue-arrow)"/>
        <line x1="304" y1="456" x2="700" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#concurrency-queue-arrow)"/>

        <!-- ============ labels ============ -->
        <rect x="644" y="204" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="666" y="216" class="d-label" fill="#4f5d75" text-anchor="middle">取槽</text>
        <rect x="608" y="470" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="636" y="482" class="d-label" fill="#5a6580" text-anchor="middle">不占槽</text>

        <!-- ============ sources ============ -->
        <rect x="64" y="140" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="140" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="80" y="166" class="d-name" fill="#2d3142">Eval accept</text>
        <text x="80" y="188" class="d-sub" fill="#4f5d75">新工单的 launch · 按角色取池</text>

        <rect x="64" y="232" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="232" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="80" y="258" class="d-name" fill="#2d3142">订阅 · CI</text>
        <text x="80" y="280" class="d-sub" fill="#4f5d75">作为 Input 投递给工单</text>

        <rect x="64" y="324" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="324" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="80" y="350" class="d-name" fill="#2d3142">人的消息</text>
        <text x="80" y="372" class="d-sub" fill="#4f5d75">唤醒空闲工单，可插队</text>

        <rect x="64" y="420" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="420" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="80" y="446" class="d-name" fill="#2d3142">讨论提问</text>
        <text x="80" y="468" class="d-sub" fill="#4f5d75">走 Answerer 自己的队列</text>

        <!-- ============ queue ============ -->
        <rect x="360" y="160" width="280" height="260" rx="8" fill="#f5f5f5"/>
        <rect x="360" y="160" width="280" height="260" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="368" y="170" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="390" y="179" class="d-tag" fill="#5a6580" text-anchor="middle">QUEUE</text>
        <text x="376" y="202" class="d-name" fill="#2d3142">等待队列</text>
        <text x="376" y="222" class="d-sub" fill="#5a6580">working / queued</text>

        <!-- slots -->
        <rect x="376" y="240" width="56" height="56" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="404" y="273" class="d-mono" fill="#5a6580" text-anchor="middle">01</text>
        <rect x="440" y="240" width="56" height="56" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="468" y="273" class="d-mono" fill="#5a6580" text-anchor="middle">02</text>
        <rect x="504" y="240" width="56" height="56" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="532" y="273" class="d-mono" fill="#5a6580" text-anchor="middle">03</text>
        <rect x="568" y="240" width="56" height="56" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.08"/>
        <text x="596" y="273" class="d-mono" fill="#bf4520" text-anchor="middle">H</text>

        <text x="376" y="320" class="d-sub" fill="#4f5d75">worker 3 个正常槽 + 1 个人工槽</text>
        <text x="376" y="342" class="d-sub" fill="#5a6580">launch 从占槽就开始，prepare 也算</text>
        <text x="376" y="362" class="d-sub" fill="#5a6580">人插队时优先拿 H，不排在新工单后面</text>
        <text x="376" y="392" class="d-mono" fill="#5a6580">a launch waits until a slot is free</text>

        <!-- ============ worker slots ============ -->
        <rect x="700" y="160" width="300" height="132" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="160" width="300" height="132" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="708" y="170" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="732" y="179" class="d-tag" fill="#5a6580" text-anchor="middle">SLOTS</text>
        <text x="716" y="202" class="d-name" fill="#2d3142">Worker 槽</text>
        <text x="716" y="224" class="d-sub" fill="#4f5d75">maxWorkers：默认 3，范围 1–16</text>
        <text x="716" y="246" class="d-sub" fill="#4f5d75">人的消息与状态查询可用 1 个额外槽</text>
        <text x="716" y="266" class="d-mono" fill="#5a6580">其他 Input（CI）等正常槽</text>
        <text x="716" y="284" class="d-mono" fill="#5a6580">A slow prepare delays only itself</text>

        <!-- ============ aligner ============ -->
        <rect x="700" y="300" width="300" height="108" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="300" width="300" height="108" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="708" y="310" width="60" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="738" y="319" class="d-tag" fill="#5a6580" text-anchor="middle">ALIGNER</text>
        <text x="716" y="344" class="d-name" fill="#2d3142">Aligner 槽 ×2</text>
        <text x="716" y="366" class="d-sub" fill="#4f5d75">ALIGN_CONCURRENCY = 2，只装对齐工单</text>
        <text x="716" y="388" class="d-mono" fill="#5a6580">worker load never counts an aligner</text>

        <!-- ============ answerer ============ -->
        <rect x="700" y="416" width="300" height="92" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="416" width="300" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="708" y="426" width="60" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="738" y="435" class="d-tag" fill="#5a6580" text-anchor="middle">ANSWERER</text>
        <text x="716" y="458" class="d-name" fill="#2d3142">Answerer 槽 ×2</text>
        <text x="716" y="480" class="d-sub" fill="#4f5d75">ANSWER_CONCURRENCY = 2</text>
        <text x="716" y="500" class="d-mono" fill="#5a6580">restart re-queues what was open</text>

        <!-- ============ deferred ============ -->
        <rect x="700" y="516" width="300" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="516" width="300" height="84" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="708" y="526" width="56" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="736" y="535" class="d-tag" fill="#5a6580" text-anchor="middle">DEFERRED</text>
        <text x="716" y="558" class="d-name" fill="#2d3142">不占槽</text>
        <text x="716" y="580" class="d-mono" fill="#5a6580">dependency ends → the launch runs</text>

        <!-- ============ annotation ============ -->
        <text x="64" y="556" class="d-annot" fill="#bf4520">容量是配置项，不是估算：多一个工单就多等一个槽。</text>
        <text x="64" y="580" class="d-annot" fill="#5a6580">人的消息永远不会被自己的队列挡住 —— 这是 H 槽存在的唯一理由。</text>

        <!-- ============ legend strip ============ -->
        <line x1="40" y1="644" x2="1240" y2="644" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="668" class="d-tag" fill="#4f5d75" letter-spacing="0.14em">LEGEND</text>
        <rect x="112" y="658" width="20" height="12" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="140" y="668" class="d-sub" fill="#4f5d75">正常槽（可能被占）</text>
        <rect x="316" y="658" width="20" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.08"/>
        <text x="344" y="668" class="d-sub" fill="#4f5d75">人工插队槽</text>
        <line x1="492" y1="664" x2="520" y2="664" stroke="#5a6580" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="528" y="668" class="d-sub" fill="#4f5d75">延后：不占槽</text>
        <text x="1240" y="668" class="d-mono" fill="#5a6580" text-anchor="end">docs/003-execution.md § Concurrency</text>
      </svg>
