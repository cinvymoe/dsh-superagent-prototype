<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="discussion-routing-title discussion-routing-desc" id="discussion-routing-root">
        <title id="discussion-routing-title">讨论成为一条可选的路：从 Router 的 discuss 决策到交付对齐</title>
        <desc id="discussion-routing-desc">流程图：面板的讨论消息进入主 Session 研判，选 mode=discuss 后交给只读 Answerer 逐条回答，结论显示在结果面板，人点交给对齐后由 Engine 建唯一的 align 工单并让 Aligner 提案 slices；编号标出本次改动的三处：discuss 决策、跟随会话输出的等待、结论交接。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #discussion-routing-root { --color-paper: #f5f5f5; --color-paper-2: #ececec;
      --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #5a6580;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #discussion-routing-root { font-family: var(--font-sans); color: var(--color-ink); }
      #discussion-routing-root .container { max-width: 1360px; margin: 0 auto; }
      #discussion-routing-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #discussion-routing-root .subtitle { font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 82ch; }
      #discussion-routing-root .diagram-container { width: 100%;
      overflow-x: auto;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.25rem; }
      #discussion-routing-root .d-tag { font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #discussion-routing-root .d-name { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
      #discussion-routing-root .d-sub { font-family: var(--font-sans); font-size: 12px; }
      #discussion-routing-root .d-mono { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; }
      #discussion-routing-root .d-arrow { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; }
      #discussion-routing-root .d-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 600; }
      #discussion-routing-root .card-header { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.7rem; }
      #discussion-routing-root .card-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      #discussion-routing-root .card-dot.coral { background: var(--color-accent); }
      #discussion-routing-root .card-dot.ink { background: var(--color-ink); }
      #discussion-routing-root .card-dot.muted { background: var(--color-soft); }
      @media print {
#discussion-routing-root .diagram-container { overflow-x: visible; background: transparent; border: 0; padding: 0; }
}</style>
          <marker id="discussion-routing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="discussion-routing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- ============ paths (drawn before boxes) ============ -->
        <line x1="312" y1="180" x2="376" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#discussion-routing-arrow)"/>
        <rect x="326" y="160" width="36" height="14" fill="#f5f5f5"/>
        <text x="344" y="171" class="d-arrow" fill="#4f5d75" text-anchor="middle">提交</text>

        <line x1="632" y1="180" x2="696" y2="180" stroke="#bf4520" stroke-width="1.4" marker-end="url(#discussion-routing-arrow-accent)"/>
        <rect x="640" y="160" width="48" height="14" fill="#f5f5f5"/>
        <text x="664" y="171" class="d-arrow" fill="#bf4520" text-anchor="middle">discuss</text>

        <line x1="828" y1="232" x2="828" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#discussion-routing-arrow)"/>
        <rect x="838" y="266" width="32" height="14" fill="#f5f5f5"/>
        <text x="854" y="277" class="d-arrow" fill="#4f5d75" text-anchor="middle">答复</text>

        <line x1="696" y1="364" x2="632" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#discussion-routing-arrow)"/>
        <rect x="640" y="344" width="48" height="14" fill="#f5f5f5"/>
        <text x="664" y="355" class="d-arrow" fill="#4f5d75" text-anchor="middle">读结论</text>

        <line x1="504" y1="416" x2="504" y2="496" stroke="#bf4520" stroke-width="1.4" marker-end="url(#discussion-routing-arrow-accent)"/>
        <rect x="514" y="450" width="52" height="14" fill="#f5f5f5"/>
        <text x="540" y="461" class="d-arrow" fill="#bf4520" text-anchor="middle">handoff</text>

        <line x1="632" y1="548" x2="696" y2="548" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#discussion-routing-arrow)"/>
        <rect x="644" y="528" width="32" height="14" fill="#f5f5f5"/>
        <text x="660" y="539" class="d-arrow" fill="#4f5d75" text-anchor="middle">提案</text>

        <!-- ============ node 1: discussion message ============ -->
        <rect x="56" y="128" width="256" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="128" width="256" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="64" y="138" width="58" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="93" y="147" class="d-tag" fill="#5a6580" text-anchor="middle">面板 · 需求</text>
        <text x="72" y="172" class="d-name" fill="#2d3142">本地需求提交</text>
        <text x="72" y="192" class="d-sub" fill="#5a6580">面板提交，进入研判</text>
        <text x="72" y="210" class="d-mono" fill="#5a6580">local:q-… · 需求自己的 Thread</text>

        <!-- ============ node 2: router decision (coral, change 1) ============ -->
        <rect x="376" y="128" width="256" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="376" y="128" width="256" height="104" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="384" y="138" width="46" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="407" y="147" class="d-tag" fill="#bf4520" text-anchor="middle">ROUTER</text>
        <text x="392" y="172" class="d-name" fill="#2d3142">主 Session 研判</text>
        <text x="392" y="192" class="d-sub" fill="#5a6580">本地需求：先谈，或直接对齐</text>
        <text x="392" y="210" class="d-mono" fill="#5a6580">accept mode=discuss / align</text>
        <circle cx="616" cy="144" r="9" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
        <text x="616" y="148" class="d-badge" fill="#bf4520" text-anchor="middle">①</text>

        <!-- ============ node 3: answerer (change 2) ============ -->
        <rect x="696" y="128" width="264" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="128" width="264" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="704" y="138" width="58" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="733" y="147" class="d-tag" fill="#5a6580" text-anchor="middle">ANSWERER</text>
        <text x="712" y="172" class="d-name" fill="#2d3142">开讨论 · 只读回答</text>
        <text x="712" y="192" class="d-sub" fill="#5a6580">不建 Ticket · 不占 worker 槽</text>
        <text x="712" y="210" class="d-mono" fill="#5a6580">effect discussion · answerer-&lt;d-…&gt;</text>
        <circle cx="944" cy="144" r="9" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
        <text x="944" y="148" class="d-badge" fill="#bf4520" text-anchor="middle">②</text>

        <!-- ============ node 4: result panel ============ -->
        <rect x="696" y="312" width="264" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="312" width="264" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="704" y="322" width="58" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="733" y="331" class="d-tag" fill="#5a6580" text-anchor="middle">结果面板</text>
        <text x="712" y="356" class="d-name" fill="#2d3142">最新一条答复</text>
        <text x="712" y="376" class="d-sub" fill="#5a6580">右栏固定，与时间线分开</text>
        <text x="712" y="394" class="d-mono" fill="#5a6580">答案状态：queued → answered</text>

        <!-- ============ node 5: the person's handoff (coral, change 3) ============ -->
        <rect x="376" y="312" width="256" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="376" y="312" width="256" height="104" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="384" y="322" width="58" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="413" y="331" class="d-tag" fill="#bf4520" text-anchor="middle">人 · 一步</text>
        <text x="392" y="356" class="d-name" fill="#2d3142">交给对齐</text>
        <text x="392" y="376" class="d-sub" fill="#5a6580">面板按钮，不是 Agent 判断</text>
        <text x="392" y="394" class="d-mono" fill="#5a6580">POST …/discussions/:id/handoff</text>
        <circle cx="616" cy="328" r="9" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
        <text x="616" y="332" class="d-badge" fill="#bf4520" text-anchor="middle">③</text>

        <!-- ============ node 6: align ticket ============ -->
        <rect x="376" y="496" width="256" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="376" y="496" width="256" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="384" y="506" width="46" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="407" y="515" class="d-tag" fill="#5a6580" text-anchor="middle">ENGINE</text>
        <text x="392" y="540" class="d-name" fill="#2d3142">align 工单</text>
        <text x="392" y="560" class="d-sub" fill="#5a6580">一个需求只一个，重复交接返回同一个</text>
        <text x="392" y="578" class="d-mono" fill="#5a6580">alignTicketId(issue) · 结论进 note</text>

        <!-- ============ node 7: aligner proposal ============ -->
        <rect x="696" y="496" width="264" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="496" width="264" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="704" y="506" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="730" y="515" class="d-tag" fill="#5a6580" text-anchor="middle">ALIGNER</text>
        <text x="712" y="540" class="d-name" fill="#2d3142">提案 slices</text>
        <text x="712" y="560" class="d-sub" fill="#5a6580">人确认后，每片一个 work 工单</text>
        <text x="712" y="578" class="d-mono" fill="#5a6580">orchestrator_align · 不回炉已定结论</text>

        <!-- ============ legend strip ============ -->
        <line x1="40" y1="644" x2="1240" y2="644" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="668" class="d-tag" fill="#4f5d75" letter-spacing="0.14em">LEGEND</text>
        <rect x="112" y="658" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
        <text x="140" y="668" class="d-sub" fill="#4f5d75">既有环节</text>
        <rect x="252" y="658" width="20" height="12" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="280" y="668" class="d-sub" fill="#4f5d75">本次改动</text>
        <line x1="392" y1="664" x2="420" y2="664" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="428" y="668" class="d-sub" fill="#4f5d75">主流程</text>
        <text x="536" y="668" class="d-sub" fill="#5a6580">① Router 可选 discuss　② 等待跟随会话输出　③ 结论由人交接</text>
        <text x="1240" y="668" class="d-mono" fill="#5a6580" text-anchor="end">docs/005-panel.md § Discussions · docs/007-architecture.md</text>
      </svg>
