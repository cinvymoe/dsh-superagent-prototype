<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="discussion-to-requirement-title discussion-to-requirement-desc" id="discussion-to-requirement-root">
        <title id="discussion-to-requirement-title">从讨论到需求：一段对话如何变成结构化记录</title>
        <desc id="discussion-to-requirement-desc">数据流图：讨论里的消息由 Answerer 逐条回答，人点 Send to issue 后把文本预填进需求对话框，提交后成为带标题、正文、图片与来源链接的需求记录，两处编号标出哪段文字落进哪个字段。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #discussion-to-requirement-root { --color-paper: #f5f5f5; --color-paper-2: #ececec;
      --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #5a6580;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #discussion-to-requirement-root { font-family: var(--font-sans); color: var(--color-ink); }
      #discussion-to-requirement-root .container { max-width: 1360px; margin: 0 auto; }
      #discussion-to-requirement-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #discussion-to-requirement-root .subtitle { font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 80ch; }
      #discussion-to-requirement-root .diagram-container { width: 100%;
      overflow-x: auto;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.25rem; }
      #discussion-to-requirement-root .d-tag { font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #discussion-to-requirement-root .d-name { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
      #discussion-to-requirement-root .d-sub { font-family: var(--font-sans); font-size: 12px; }
      #discussion-to-requirement-root .d-mono { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; }
      #discussion-to-requirement-root .d-arrow { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; }
      #discussion-to-requirement-root .d-label { font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
      #discussion-to-requirement-root .d-annot { font-family: var(--font-serif); font-style: italic; font-size: 14px; }
      #discussion-to-requirement-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(45,49,66,0.08); }
      #discussion-to-requirement-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      #discussion-to-requirement-root .card-dot.coral { background: var(--color-accent); }
      #discussion-to-requirement-root .card-dot.muted { background: var(--color-muted); }
      #discussion-to-requirement-root .card-dot.ink { background: var(--color-ink); }
      @media print {
#discussion-to-requirement-root .diagram-container { overflow-x: visible; background: transparent; border: 0; padding: 0; }
}</style>
          <marker id="discussion-to-requirement-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="discussion-to-requirement-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="discussion-to-requirement-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- ============ paths ============ -->
        <line x1="440" y1="290" x2="520" y2="290" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#discussion-to-requirement-arrow)"/>
        <line x1="800" y1="290" x2="880" y2="290" stroke="#bf4520" stroke-width="1.4" marker-end="url(#discussion-to-requirement-arrow-accent)"/>

        <!-- ============ discussion (source utterance) ============ -->
        <rect x="64" y="150" width="376" height="280" rx="8" fill="#f5f5f5"/>
        <rect x="64" y="150" width="376" height="280" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="80" y="178" class="d-name" fill="#2d3142">讨论</text>
        <text x="160" y="178" class="d-sub" fill="#5a6580">自己的 Thread，Answerer 逐条回答</text>
        <text x="80" y="196" class="d-mono" fill="#5a6580">local:d-… · 不产生 Ticket，也不进 Eval</text>

        <rect x="80" y="212" width="344" height="52" rx="4" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.04" stroke-opacity="0.12"/>
        <text x="92" y="232" class="d-sub" fill="#2d3142"><tspan class="d-arrow" fill="#5a6580">① 人　</tspan>登录页在移动端会把按钮挤出屏幕</text>
        <text x="92" y="252" class="d-sub" fill="#4f5d75">顺手把截图贴了上来（1 张）</text>

        <rect x="104" y="272" width="320" height="44" rx="4" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,3" stroke-opacity="0.12"/>
        <text x="116" y="298" class="d-sub" fill="#5a6580">回答：已在 375px 宽度下复现，问题在栅格</text>

        <rect x="80" y="324" width="344" height="52" rx="4" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.04" stroke-opacity="0.12"/>
        <text x="92" y="344" class="d-sub" fill="#2d3142"><tspan class="d-arrow" fill="#5a6580">② 人　</tspan>只要 375 和 768 两个断点，别改设计稿</text>
        <text x="92" y="364" class="d-sub" fill="#4f5d75">这条约束决定验收标准</text>

        <text x="80" y="404" class="d-mono" fill="#5a6580">messages are Triggers, stored, never evaluated</text>

        <!-- ============ transformation ============ -->
        <rect x="520" y="250" width="280" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="250" width="280" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="528" y="260" width="64" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="560" y="269" class="d-tag" fill="#5a6580" text-anchor="middle">HUMAN STEP</text>
        <text x="536" y="292" class="d-name" fill="#2d3142">Send to issue</text>
        <text x="536" y="312" class="d-sub" fill="#5a6580">预填对话框，文本仍可改</text>
        <text x="536" y="326" class="d-mono" fill="#5a6580">one discussion → at most one requirement</text>

        <!-- ============ artifact ============ -->
        <rect x="880" y="150" width="360" height="320" rx="8" fill="#f5f5f5"/>
        <rect x="880" y="150" width="360" height="320" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="896" y="162" width="72" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="932" y="171" class="d-tag" fill="#bf4520" text-anchor="middle">REQUIREMENT</text>
        <text x="896" y="196" class="d-name" fill="#2d3142">需求 local:q-…</text>
        <text x="896" y="214" class="d-mono" fill="#5a6580">title · body · images · source · state</text>

        <line x1="896" y1="226" x2="1224" y2="226" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.30"/>

        <text x="896" y="250" class="d-arrow" fill="#5a6580">TITLE</text>
        <text x="1072" y="250" class="d-sub" fill="#2d3142" text-anchor="end">① 第一行，≤ 200 字</text>
        <text x="896" y="266" class="d-mono" fill="#5a6580">whitespace collapsed</text>

        <text x="896" y="296" class="d-arrow" fill="#5a6580">BODY</text>
        <text x="1072" y="296" class="d-sub" fill="#2d3142" text-anchor="end">全文，含 ② 的约束</text>
        <text x="896" y="312" class="d-mono" fill="#5a6580">the dialog can still edit it</text>

        <text x="896" y="342" class="d-arrow" fill="#5a6580">IMAGES</text>
        <text x="1072" y="342" class="d-sub" fill="#2d3142" text-anchor="end">0–4 张 · ≤ 5 MiB</text>
        <text x="896" y="358" class="d-mono" fill="#5a6580">png · jpeg · webp · gif</text>

        <text x="896" y="388" class="d-arrow" fill="#5a6580">SOURCE</text>
        <text x="1072" y="388" class="d-sub" fill="#2d3142" text-anchor="end">③ 这条讨论，双向链接</text>
        <text x="896" y="404" class="d-mono" fill="#5a6580">empty when created directly</text>

        <text x="896" y="434" class="d-arrow" fill="#5a6580">STATE</text>
        <text x="1072" y="434" class="d-sub" fill="#2d3142" text-anchor="end">Open → 对齐 → 已确认</text>
        <text x="896" y="450" class="d-mono" fill="#5a6580">execution: native by default</text>

        <!-- ============ annotations ============ -->
        <text x="64" y="476" class="d-annot" fill="#bf4520">回答不是字段提取：Answerer 只回答问题，不写记录。</text>
        <text x="64" y="500" class="d-annot" fill="#5a6580">需求一旦存在，Send to issue 换成 Open requirement；讨论关掉也不影响它。</text>
        <text x="64" y="530" class="d-mono" fill="#5a6580">①②③ = 这段文字落进了哪个字段；没有的字段留空，不推断</text>

        <!-- ============ legend strip ============ -->
        <line x1="40" y1="644" x2="1240" y2="644" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="668" class="d-tag" fill="#4f5d75" letter-spacing="0.14em">LEGEND</text>
        <rect x="112" y="658" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
        <text x="140" y="668" class="d-sub" fill="#4f5d75">对话（不是字段）</text>
        <rect x="296" y="658" width="20" height="12" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="324" y="668" class="d-sub" fill="#4f5d75">可授权的记录</text>
        <line x1="464" y1="664" x2="492" y2="664" stroke="#5a6580" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="500" y="668" class="d-sub" fill="#4f5d75">回答（不写记录）</text>
        <text x="664" y="668" class="d-sub" fill="#5a6580">编号 = 出处映射</text>
        <text x="1240" y="668" class="d-mono" fill="#5a6580" text-anchor="end">docs/005-panel.md § Discussions</text>
      </svg>
