<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="domain-model-title domain-model-desc" id="domain-model-root">
        <title id="domain-model-title">dsh-superagent 领域模型：七个概念与授权链</title>
        <desc id="domain-model-desc">领域模型实体图：Source 产生 Trigger，Trigger 落在 Thread 上并扇出到订阅的 Ticket；Thread 串行运行 Eval，Eval 的 accept 创建 Ticket 与 Mandate；Assignment 绑定 Executor，Channel 把结果写回 Source。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #domain-model-root { --color-paper: #f5f5f5; --color-paper-2: #ececec;
      --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #5a6580;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #domain-model-root { font-family: var(--font-sans); color: var(--color-ink); }
      #domain-model-root .container { max-width: 1360px; margin: 0 auto; }
      #domain-model-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #domain-model-root .subtitle { font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 80ch; }
      #domain-model-root .diagram-container { width: 100%;
      overflow-x: auto;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.25rem; }
      #domain-model-root .d-tag { font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #domain-model-root .d-name { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
      #domain-model-root .d-sub { font-family: var(--font-sans); font-size: 12px; }
      #domain-model-root .d-mono { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; }
      #domain-model-root .d-arrow { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; }
      #domain-model-root .d-label { font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
      #domain-model-root .d-annot { font-family: var(--font-serif); font-style: italic; font-size: 14px; }
      #domain-model-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(45,49,66,0.08); }
      #domain-model-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      #domain-model-root .card-dot.coral { background: var(--color-accent); }
      #domain-model-root .card-dot.muted { background: var(--color-muted); }
      #domain-model-root .card-dot.ink { background: var(--color-ink); }
      @media print {
#domain-model-root .diagram-container { overflow-x: visible; background: transparent; border: 0; padding: 0; }
}</style>
          <marker id="domain-model-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="domain-model-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="domain-model-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- ============ connectors first (behind the boxes) ============ -->
        <!-- Source -> Trigger -->
        <line x1="136" y1="232" x2="136" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#domain-model-arrow)"/>
        <!-- Source -> Thread -->
        <line x1="320" y1="120" x2="400" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#domain-model-arrow)"/>
        <!-- Thread -> Eval -->
        <line x1="560" y1="252" x2="560" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#domain-model-arrow)"/>
        <!-- Eval -> Ticket (accept) -->
        <path d="M 720,320 H 744 Q 752,320 752,312 V 156 Q 752,148 760,148 H 800"
              fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#domain-model-arrow-accent)"/>
        <!-- Thread <-> Ticket : Subscription, dashed -->
        <path d="M 680,80 V 56 Q 680,48 688,48 H 992 Q 1000,48 1000,56 V 80"
              fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#domain-model-arrow)"/>
        <!-- Ticket -> Assignment -->
        <line x1="880" y1="280" x2="880" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#domain-model-arrow)"/>
        <!-- Ticket -> Channel -->
        <line x1="1120" y1="280" x2="1120" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#domain-model-arrow)"/>
        <!-- Channel -> Source : write back -->
        <path d="M 1140,504 V 552 Q 1140,560 1132,560 H 44 Q 36,560 36,552 V 168 Q 36,160 44,160 H 48"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#domain-model-arrow)"/>

        <!-- ============ arrow labels ============ -->
        <rect x="144" y="252" width="34" height="14" rx="2" fill="#f5f5f5"/>
        <text x="161" y="263" class="d-arrow" fill="#5a6580" text-anchor="middle">1 : N</text>

        <rect x="343" y="100" width="34" height="14" rx="2" fill="#f5f5f5"/>
        <text x="360" y="111" class="d-arrow" fill="#5a6580" text-anchor="middle">1 : N</text>

        <rect x="568" y="264" width="34" height="14" rx="2" fill="#f5f5f5"/>
        <text x="585" y="275" class="d-arrow" fill="#5a6580" text-anchor="middle">1 : N</text>

        <rect x="704" y="264" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="724" y="275" class="d-arrow" fill="#bf4520" text-anchor="middle">ACCEPT</text>

        <rect x="792" y="24" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="840" y="35" class="d-arrow" fill="#5a6580" text-anchor="middle">SUBSCRIPTION N:M</text>

        <rect x="888" y="304" width="34" height="14" rx="2" fill="#f5f5f5"/>
        <text x="905" y="315" class="d-arrow" fill="#5a6580" text-anchor="middle">1 : N</text>

        <rect x="1128" y="304" width="34" height="14" rx="2" fill="#f5f5f5"/>
        <text x="1145" y="315" class="d-arrow" fill="#5a6580" text-anchor="middle">1 : N</text>

        <rect x="500" y="538" width="140" height="16" rx="2" fill="#f5f5f5"/>
        <text x="570" y="549" class="d-label" fill="#4f5d75" text-anchor="middle">回写：ack · reply · PR</text>

        <!-- ============ entities ============ -->

        <!-- Source -->
        <rect x="48" y="80" width="272" height="152" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="80" width="272" height="152" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="56" y="90" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="80" y="99" class="d-tag" fill="#5a6580" text-anchor="middle">SOURCE</text>
        <text x="64" y="124" class="d-name" fill="#2d3142">Source</text>
        <line x1="64" y1="134" x2="304" y2="134" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="64" y="154" class="d-sub" fill="#4f5d75">一个 kind + 一个实例配置</text>
        <text x="64" y="172" class="d-sub" fill="#4f5d75">持有自己的读位置</text>
        <text x="64" y="190" class="d-sub" fill="#4f5d75">定义 Thread 与 Channel</text>
        <text x="64" y="208" class="d-sub" fill="#4f5d75">Policy 的 Source 部分</text>

        <!-- Trigger -->
        <rect x="48" y="296" width="272" height="148" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="296" width="272" height="148" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="56" y="306" width="56" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="84" y="315" class="d-tag" fill="#5a6580" text-anchor="middle">TRIGGER</text>
        <text x="64" y="340" class="d-name" fill="#2d3142">Trigger</text>
        <line x1="64" y1="350" x2="304" y2="350" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="64" y="370" class="d-sub" fill="#4f5d75">不可变；按 Thread 去重</text>
        <text x="64" y="388" class="d-sub" fill="#4f5d75">actor：Source 自己的标识</text>
        <text x="64" y="406" class="d-sub" fill="#4f5d75">disposition：filter / eval / fan</text>
        <text x="64" y="424" class="d-sub" fill="#4f5d75">接受两次只建一个 Ticket</text>

        <!-- Thread -->
        <rect x="400" y="80" width="320" height="172" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="80" width="320" height="172" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="90" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="430" y="99" class="d-tag" fill="#5a6580" text-anchor="middle">THREAD</text>
        <text x="416" y="124" class="d-name" fill="#2d3142">Thread</text>
        <line x1="416" y1="134" x2="704" y2="134" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="416" y="154" class="d-sub" fill="#4f5d75">Trigger 的时间序（Source 定义）</text>
        <text x="416" y="172" class="d-sub" fill="#4f5d75">同时只跑一个 Eval</text>
        <text x="416" y="190" class="d-mono" fill="#4f5d75">subscriptions：N:M → Ticket</text>
        <text x="416" y="208" class="d-sub" fill="#4f5d75">runningEval · 决策历史</text>
        <text x="416" y="226" class="d-sub" fill="#4f5d75">订阅由 Thread 持有</text>

        <!-- Eval -->
        <rect x="400" y="296" width="320" height="180" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="296" width="320" height="180" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="306" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="426" y="315" class="d-tag" fill="#5a6580" text-anchor="middle">EVAL</text>
        <text x="416" y="340" class="d-name" fill="#2d3142">Eval · Decision</text>
        <line x1="416" y1="350" x2="704" y2="350" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="416" y="370" class="d-sub" fill="#4f5d75">输入：批次 · Thread 快照</text>
        <text x="416" y="388" class="d-sub" fill="#4f5d75">　　　· 全部 Ticket · Policy</text>
        <text x="416" y="406" class="d-sub" fill="#4f5d75">gate 给强度；assessment 判规则</text>
        <text x="416" y="424" class="d-mono" fill="#4f5d75">Decision: accept · stop · ignore</text>
        <text x="416" y="442" class="d-mono" fill="#4f5d75">　　　　　　 unavailable</text>
        <text x="416" y="462" class="d-sub" fill="#5a6580">无状态</text>

        <!-- Ticket · Mandate (focal) -->
        <rect x="800" y="80" width="432" height="200" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="80" width="432" height="200" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="816" y="90" width="104" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="868" y="99" class="d-tag" fill="#bf4520" text-anchor="middle">TICKET · AGGREGATE</text>
        <text x="816" y="130" class="d-name" fill="#2d3142">Ticket  （Mandate 记在票上）</text>
        <line x1="816" y1="140" x2="1216" y2="140" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="816" y="162" class="d-mono" fill="#4f5d75">id · mode: work | align</text>
        <text x="816" y="182" class="d-sub" fill="#2d3142">状态 open ⇄ ended（由 Ticket 自己定义）</text>
        <text x="816" y="202" class="d-mono" fill="#4f5d75">mandate: policyVersion · scope · strength</text>
        <text x="816" y="220" class="d-sub" fill="#4f5d75">inputs · subscriptions · channels</text>
        <text x="816" y="242" class="d-sub" fill="#2d3142">只有 accept 创建；人的 stop 撤销</text>
        <text x="816" y="262" class="d-sub" fill="#5a6580">结束不结束 Mandate；恢复前重新校验</text>

        <!-- Assignment -->
        <rect x="800" y="352" width="208" height="152" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="352" width="208" height="152" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="808" y="362" width="60" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="838" y="371" class="d-tag" fill="#5a6580" text-anchor="middle">ASSIGNMENT</text>
        <text x="816" y="396" class="d-name" fill="#2d3142">Assignment</text>
        <line x1="816" y1="406" x2="992" y2="406" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="816" y="426" class="d-sub" fill="#4f5d75">一个 Ticket 可多次</text>
        <text x="816" y="444" class="d-mono" fill="#4f5d75">pending → running → ended</text>
        <text x="816" y="462" class="d-sub" fill="#4f5d75">与 Ticket 状态各自独立</text>
        <text x="816" y="480" class="d-mono" fill="#4f5d75">report: progress · waiting</text>
        <text x="816" y="496" class="d-mono" fill="#4f5d75">　　　 ready · blocked · failed</text>

        <!-- Channel -->
        <rect x="1052" y="352" width="180" height="152" rx="6" fill="#f5f5f5"/>
        <rect x="1052" y="352" width="180" height="152" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="1060" y="362" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="1086" y="371" class="d-tag" fill="#5a6580" text-anchor="middle">CHANNEL</text>
        <text x="1068" y="396" class="d-name" fill="#2d3142">Channel</text>
        <line x1="1068" y1="406" x2="1216" y2="406" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="1068" y="426" class="d-sub" fill="#4f5d75">Thread 的写侧</text>
        <text x="1068" y="444" class="d-mono" fill="#4f5d75">ack · reply</text>
        <text x="1068" y="462" class="d-mono" fill="#4f5d75">pull request · review</text>
        <text x="1068" y="482" class="d-sub" fill="#5a6580">地址由 Source 定义</text>

        <!-- ============ annotation ============ -->
        <text x="48" y="522" class="d-annot" fill="#bf4520">Policy 只以版本号进入 Mandate。</text>
        <text x="48" y="546" class="d-annot" fill="#5a6580">改规则丢弃进行中的 Eval，不撤销已发出的授权。</text>

        <!-- ============ legend strip ============ -->
        <line x1="40" y1="644" x2="1240" y2="644" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="668" class="d-tag" fill="#4f5d75" letter-spacing="0.14em">LEGEND</text>
        <rect x="116" y="658" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="668" class="d-sub" fill="#4f5d75">领域概念</text>
        <line x1="256" y1="664" x2="284" y2="664" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#domain-model-arrow)"/>
        <text x="292" y="668" class="d-sub" fill="#4f5d75">引用 / 拥有</text>
        <line x1="424" y1="664" x2="452" y2="664" stroke="#5a6580" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="460" y="668" class="d-sub" fill="#4f5d75">上下文关系（不含授权）</text>
        <rect x="672" y="658" width="20" height="12" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="700" y="668" class="d-sub" fill="#4f5d75">唯一有授权的产物</text>
        <text x="1240" y="668" class="d-mono" fill="#5a6580" text-anchor="end">docs/001-domain.md</text>
      </svg>
