<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="module-dependencies-title module-dependencies-desc" id="module-dependencies-root">
        <title id="module-dependencies-title">模块依赖：core、胶水层、Sources、工具与面板的单向依赖</title>
        <desc id="module-dependencies-desc">依赖图：插件入口与面板依赖胶水层，胶水层依赖 Sources、Session 工具、管理接口、宿主与 core；Sources、工具与管理接口都依赖 core，core 不依赖自身之外的模块。</desc>
