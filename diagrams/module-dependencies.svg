      #module-dependencies-root .d-annot { font-family: var(--font-serif); font-style: italic; font-size: 14px; }
      #module-dependencies-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(45,49,66,0.08); }
      #module-dependencies-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      #module-dependencies-root .card-dot.coral { background: var(--color-accent); }
      #module-dependencies-root .card-dot.muted { background: var(--color-muted); }
      #module-dependencies-root .card-dot.ink { background: var(--color-ink); }
      @media print {
#module-dependencies-root .diagram-container { overflow-x: visible; background: transparent; border: 0; padding: 0; }
}</style>
