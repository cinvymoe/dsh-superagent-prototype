<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="requirement-lifecycle-title requirement-lifecycle-desc" id="requirement-lifecycle-root">
        <title id="requirement-lifecycle-title">需求的生命周期：讨论、提案、确认、派发、待关闭与关闭</title>
        <desc id="requirement-lifecycle-desc">状态机图：讨论通过 Send to issue 变成需求，需求由 align Ticket 产出对齐提案，人确认后按 slice 派发 Ticket；全部 Ticket 结束进入 Pending close，人关闭后结束，Ticket 恢复则标签回到 Open。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #requirement-lifecycle-root { --color-paper: #f5f5f5; --color-paper-2: #ececec;
      --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #5a6580;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #requirement-lifecycle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #requirement-lifecycle-root .container { max-width: 1360px; margin: 0 auto; }
      #requirement-lifecycle-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #requirement-lifecycle-root .subtitle { font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 80ch; }
      #requirement-lifecycle-root .diagram-container { width: 100%;
      overflow-x: auto;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.25rem; }
      #requirement-lifecycle-root .d-tag { font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #requirement-lifecycle-root .d-name { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
      #requirement-lifecycle-root .d-sub { font-family: var(--font-sans); font-size: 12px; }
      #requirement-lifecycle-root .d-mono { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; }
      #requirement-lifecycle-root .d-arrow { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; }
      #requirement-lifecycle-root .d-label { font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
      #requirement-lifecycle-root .d-annot { font-family: var(--font-serif); font-style: italic; font-size: 14px; }
      #requirement-lifecycle-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(45,49,66,0.08); }
      #requirement-lifecycle-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      #requirement-lifecycle-root .card-dot.coral { background: var(--color-accent); }
      #requirement-lifecycle-root .card-dot.muted { background: var(--color-muted); }
      #requirement-lifecycle-root .card-dot.ink { background: var(--color-ink); }
      @media print {
#requirement-lifecycle-root .diagram-container { overflow-x: visible; background: transparent; border: 0; padding: 0; }
}</style>
          <marker id="requirement-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="requirement-lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="requirement-lifecycle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- ============ connectors ============ -->
        <line x1="70" y1="200" x2="88" y2="200" stroke="#2d3142" stroke-width="1.2" marker-end="url(#requirement-lifecycle-arrow)"/>
        <line x1="248" y1="200" x2="304" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#requirement-lifecycle-arrow)"/>
        <line x1="464" y1="200" x2="520" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#requirement-lifecycle-arrow)"/>
        <line x1="680" y1="200" x2="736" y2="200" stroke="#bf4520" stroke-width="1.4" marker-end="url(#requirement-lifecycle-arrow-accent)"/>
        <path d="M 600,160 V 120 Q 600,112 592,112 H 392 Q 384,112 384,120 V 160"
              fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#requirement-lifecycle-arrow)"/>
        <line x1="816" y1="240" x2="816" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#requirement-lifecycle-arrow)"/>
        <line x1="896" y1="392" x2="952" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#requirement-lifecycle-arrow)"/>
        <path d="M 816,432 V 536 Q 816,544 808,544 H 392 Q 384,544 384,536 V 240"
              fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#requirement-lifecycle-arrow)"/>

        <!-- ============ labels ============ -->
        <rect x="252" y="178" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="276" y="190" class="d-label" fill="#4f5d75" text-anchor="middle">提交</text>

        <rect x="468" y="178" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="492" y="190" class="d-label" fill="#4f5d75" text-anchor="middle">提案</text>

        <rect x="684" y="178" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="708" y="190" class="d-label" fill="#bf4520" text-anchor="middle">确认</text>

        <rect x="488" y="88" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="536" y="100" class="d-label" fill="#5a6580" text-anchor="middle">打回 · 写回原因</text>

        <rect x="758" y="284" width="116" height="16" rx="2" fill="#f5f5f5"/>
        <text x="816" y="296" class="d-label" fill="#4f5d75" text-anchor="middle">slice 全部结束</text>

        <rect x="902" y="370" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="924" y="382" class="d-label" fill="#4f5d75" text-anchor="middle">关闭</text>

        <rect x="512" y="518" width="116" height="16" rx="2" fill="#f5f5f5"/>
        <text x="570" y="530" class="d-label" fill="#5a6580" text-anchor="middle">某个 Ticket 恢复</text>

        <!-- ============ states ============ -->
        <circle cx="64" cy="200" r="6" fill="#2d3142"/>

        <rect x="88" y="160" width="160" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="88" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="104" y="184" class="d-tag" fill="#5a6580">DISCUSSION</text>
        <text x="104" y="206" class="d-name" fill="#2d3142">讨论</text>
        <text x="104" y="226" class="d-sub" fill="#5a6580">自己的 Thread</text>

        <rect x="304" y="160" width="160" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="304" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="184" class="d-tag" fill="#5a6580">OPEN</text>
        <text x="320" y="206" class="d-name" fill="#2d3142">需求 Open</text>
        <text x="320" y="226" class="d-sub" fill="#5a6580">还没有对齐提案</text>

        <rect x="520" y="160" width="160" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="520" y="160" width="160" height="80" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="536" y="184" class="d-tag" fill="#bf4520">ROUND</text>
        <text x="536" y="206" class="d-name" fill="#2d3142">对齐提案</text>
        <text x="536" y="226" class="d-mono" fill="#5a6580">summary · slices</text>

        <rect x="736" y="160" width="160" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="736" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="752" y="184" class="d-tag" fill="#5a6580">CONFIRMED</text>
        <text x="752" y="206" class="d-name" fill="#2d3142">已确认</text>
        <text x="752" y="226" class="d-sub" fill="#5a6580">每个 slice 一个 Ticket</text>

        <rect x="736" y="352" width="160" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="736" y="352" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="752" y="376" class="d-tag" fill="#5a6580">DERIVED</text>
        <text x="752" y="398" class="d-name" fill="#2d3142">Pending close</text>
        <text x="752" y="418" class="d-sub" fill="#5a6580">执行已停，只差关闭</text>

        <rect x="952" y="352" width="160" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="952" y="352" width="160" height="80" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.05"/>
        <text x="968" y="376" class="d-tag" fill="#5a6580">CLOSED</text>
        <text x="968" y="398" class="d-name" fill="#2d3142">Closed</text>
        <text x="968" y="418" class="d-sub" fill="#5a6580">人关闭 · 记录保留</text>

        <!-- ============ annotations ============ -->
        <text x="952" y="188" class="d-annot" fill="#bf4520">执行方式在这里固定：</text>
        <text x="952" y="210" class="d-annot" fill="#5a6580">native 或 feature-exec，</text>
        <text x="952" y="232" class="d-annot" fill="#5a6580">派发后不可改。</text>

        <text x="88" y="596" class="d-annot" fill="#5a6580">Pending close 只看「所有 slice Ticket 是否结束」，</text>
        <text x="88" y="620" class="d-annot" fill="#5a6580">不代表每个 slice 都成功 —— stop 也算结束。</text>

        <!-- ============ legend strip ============ -->
        <line x1="40" y1="644" x2="1240" y2="644" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="668" class="d-tag" fill="#4f5d75" letter-spacing="0.14em">LEGEND</text>
        <circle cx="126" cy="664" r="5" fill="#2d3142"/>
        <text x="140" y="668" class="d-sub" fill="#4f5d75">起点</text>
        <line x1="212" y1="664" x2="240" y2="664" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#requirement-lifecycle-arrow)"/>
        <text x="248" y="668" class="d-sub" fill="#4f5d75">人的动作推进的状态</text>
        <line x1="440" y1="664" x2="468" y2="664" stroke="#5a6580" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="476" y="668" class="d-sub" fill="#4f5d75">打回 / 恢复</text>
        <rect x="612" y="658" width="20" height="12" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="640" y="668" class="d-sub" fill="#4f5d75">必须由人做决定的一步</text>
        <text x="1240" y="668" class="d-mono" fill="#5a6580" text-anchor="end">docs/005-panel.md § Requirement states</text>
      </svg>
