        <!-- ============ notes ============ -->
        <text x="64" y="428" class="d-annot" fill="#bf4520">同一个 (kind, key) 只有一行：主键就是幂等键。</text>
        <text x="64" y="452" class="d-annot" fill="#5a6580">重试只是把 due 往后挪，任务本身不重复入队。</text>

        <text x="64" y="500" class="d-mono" fill="#5a6580">kind = launch · delivery · reply · assessment · relay</text>
        <text x="64" y="518" class="d-mono" fill="#5a6580">due 升序 + seq：同 due 内保序</text>

        <text x="64" y="560" class="d-annot" fill="#5a6580">没有一条 DELETE：收据、去向、版本快照都留着。</text>

        <text x="520" y="470" class="d-mono" fill="#5a6580">read by trigger id — no index needed</text>

        <!-- right column: what the JSON points at -->
        <text x="976" y="280" class="d-tag" fill="#5a6580" letter-spacing="0.12em">INSIDE THE JSON</text>
        <text x="976" y="304" class="d-mono" fill="#5a6580">settings-revision</text>
        <text x="976" y="322" class="d-mono" fill="#5a6580">settings-version:&lt;n&gt;</text>
        <text x="976" y="340" class="d-mono" fill="#5a6580">prompt-revision</text>
        <text x="976" y="358" class="d-mono" fill="#5a6580">github-cursor:&lt;n&gt;</text>
        <text x="976" y="376" class="d-mono" fill="#5a6580">session-prompts:&lt;id&gt;</text>
        <text x="976" y="400" class="d-sub" fill="#5a6580">读位置、版本、会话提示历史</text>

        <text x="976" y="444" class="d-annot" fill="#5a6580">收据先写，消息后发：</text>
        <text x="976" y="466" class="d-annot" fill="#5a6580">同一个 id 不会发两次。</text>

