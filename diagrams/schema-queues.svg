<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="schema-queues-title schema-queues-desc" id="schema-queues-root">
        <title id="schema-queues-title">队列与收据的物理表：effect、outbox、disposition、kv</title>
        <desc id="schema-queues-desc">数据库结构图：effect 以 kind 与 key 为主键按 due 排序重试，outbox 以消息 id 为收据并用生成列维持会话内顺序，disposition 记录每条 Trigger 的去向，kv 保存其余键值记录。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #schema-queues-root { --color-paper: #f5f5f5; --color-paper-2: #ececec;
      --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #5a6580;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #schema-queues-root { font-family: var(--font-sans); color: var(--color-ink); }
      #schema-queues-root .container { max-width: 1360px; margin: 0 auto; }
      #schema-queues-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #schema-queues-root .subtitle { font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 80ch; }
      #schema-queues-root .diagram-container { width: 100%;
      overflow-x: auto;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.25rem; }
      #schema-queues-root .d-tag { font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #schema-queues-root .d-name { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
      #schema-queues-root .d-sub { font-family: var(--font-sans); font-size: 12px; }
      #schema-queues-root .d-mono { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; }
      #schema-queues-root .d-arrow { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; }
      #schema-queues-root .d-label { font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
      #schema-queues-root .d-annot { font-family: var(--font-serif); font-style: italic; font-size: 14px; }
      #schema-queues-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(45,49,66,0.08); }
      #schema-queues-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      #schema-queues-root .card-dot.coral { background: var(--color-accent); }
      #schema-queues-root .card-dot.muted { background: var(--color-muted); }
      #schema-queues-root .card-dot.ink { background: var(--color-ink); }
      @media print {
#schema-queues-root .diagram-container { overflow-x: visible; background: transparent; border: 0; padding: 0; }
}</style>
