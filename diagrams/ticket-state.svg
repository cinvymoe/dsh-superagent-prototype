<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ticket-lifecycle-title ticket-lifecycle-desc" id="ticket-state-root">
        <title id="ticket-lifecycle-title">Ticket 的生命周期：排队、工作、等人、空闲与结束</title>
        <desc id="ticket-lifecycle-desc">状态机图：Ticket 从排队进入工作，工作时可转入等人回答、等人审阅或受阻失败；人回复后回到工作，空闲等待新的 Trigger，PR 结束后结束，人的消息可按同一 Mandate 恢复。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ticket-state-root { --color-paper: #f5f5f5; --color-paper-2: #ececec;
      --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #5a6580;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #ticket-state-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ticket-state-root .container { max-width: 1360px; margin: 0 auto; }
      #ticket-state-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #ticket-state-root .subtitle { font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 80ch; }
      #ticket-state-root .diagram-container { width: 100%;
      overflow-x: auto;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.25rem; }
      #ticket-state-root .d-tag { font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #ticket-state-root .d-name { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
      #ticket-state-root .d-sub { font-family: var(--font-sans); font-size: 12px; }
      #ticket-state-root .d-mono { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; }
      #ticket-state-root .d-arrow { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; }
      #ticket-state-root .d-label { font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
      #ticket-state-root .d-annot { font-family: var(--font-serif); font-style: italic; font-size: 14px; }
      #ticket-state-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(45,49,66,0.08); }
      #ticket-state-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      #ticket-state-root .card-dot.coral { background: var(--color-accent); }
      #ticket-state-root .card-dot.muted { background: var(--color-muted); }
      #ticket-state-root .card-dot.ink { background: var(--color-ink); }
      @media print {
#ticket-state-root .diagram-container { overflow-x: visible; background: transparent; border: 0; padding: 0; }
}</style>
          <marker id="ticket-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="ticket-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="ticket-state-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- ============ connectors ============ -->
        <line x1="62" y1="180" x2="80" y2="180" stroke="#2d3142" stroke-width="1.2" marker-end="url(#ticket-state-arrow)"/>
        <line x1="240" y1="200" x2="304" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-state-arrow)"/>
        <line x1="464" y1="200" x2="528" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-state-arrow)"/>
        <path d="M 608,160 V 120 Q 608,112 600,112 H 424 Q 416,112 416,120 V 160"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-state-arrow)"/>
        <line x1="344" y1="240" x2="344" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-state-arrow)"/>
        <path d="M 424,240 V 288 Q 424,296 432,296 H 600 Q 608,296 608,304 V 352"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-state-arrow)"/>
        <path d="M 344,160 V 88 Q 344,80 352,80 H 824 Q 832,80 832,88 V 352"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-state-arrow)"/>
        <path d="M 512,392 H 496 Q 488,392 488,384 V 224 Q 488,216 480,216 H 464"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-state-arrow)"/>
        <path d="M 288,392 H 272 Q 264,392 264,384 V 224 Q 264,216 272,216 H 304"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-state-arrow)"/>
        <path d="M 928,392 H 984 Q 992,392 992,384 V 344 Q 992,336 1000,336 H 1040"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-state-arrow)"/>
        <path d="M 1136,400 V 552 Q 1136,560 1128,560 H 64 Q 56,560 56,552 V 228 Q 56,220 64,220 H 80"
              fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ticket-state-arrow)"/>

        <!-- ============ arrow labels ============ -->
        <rect x="252" y="178" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="272" y="189" class="d-arrow" fill="#4f5d75" text-anchor="middle">LAUNCH</text>

        <rect x="476" y="174" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="496" y="186" class="d-label" fill="#4f5d75" text-anchor="middle">结束</text>

        <rect x="502" y="86" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="530" y="98" class="d-label" fill="#4f5d75" text-anchor="middle">新 Trigger</text>

        <rect x="352" y="296" width="88" height="14" rx="2" fill="#f5f5f5"/>
        <text x="396" y="307" class="d-arrow" fill="#5a6580" text-anchor="middle">BLOCKED / FAILED</text>

        <rect x="492" y="274" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="520" y="285" class="d-arrow" fill="#5a6580" text-anchor="middle">ATTENTION</text>

        <rect x="568" y="58" width="40" height="14" rx="2" fill="#f5f5f5"/>
        <text x="588" y="69" class="d-arrow" fill="#5a6580" text-anchor="middle">READY</text>

        <rect x="440" y="328" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="460" y="340" class="d-label" fill="#4f5d75" text-anchor="middle">人回答</text>

        <rect x="216" y="292" width="40" height="16" rx="2" fill="#f5f5f5"/>
        <text x="236" y="304" class="d-label" fill="#4f5d75" text-anchor="middle">人消息</text>

        <rect x="936" y="292" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="960" y="304" class="d-label" fill="#4f5d75" text-anchor="middle">PR 结束</text>

        <rect x="470" y="536" width="180" height="16" rx="2" fill="#f5f5f5"/>
        <text x="560" y="548" class="d-label" fill="#5a6580" text-anchor="middle">人的消息（Mandate 仍有效）</text>

        <!-- ============ nodes ============ -->

        <!-- start -->
        <circle cx="56" cy="180" r="6" fill="#2d3142"/>

        <!-- queued -->
        <rect x="80" y="160" width="160" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="80" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="96" y="186" class="d-tag" fill="#5a6580">OPEN</text>
        <text x="96" y="208" class="d-name" fill="#2d3142">Queued</text>
        <text x="96" y="228" class="d-sub" fill="#4f5d75">等一个 worker slot</text>

        <!-- working (focal) -->
        <rect x="304" y="160" width="160" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="304" y="160" width="160" height="80" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="320" y="186" class="d-tag" fill="#bf4520">WORKING</text>
        <text x="320" y="208" class="d-name" fill="#2d3142">Working</text>
        <text x="320" y="228" class="d-sub" fill="#4f5d75">turn 进行中 · 持 slot</text>

        <!-- idle -->
        <rect x="528" y="160" width="160" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="528" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="544" y="186" class="d-tag" fill="#5a6580">IDLE</text>
        <text x="544" y="208" class="d-name" fill="#2d3142">Waiting</text>
        <text x="544" y="228" class="d-sub" fill="#4f5d75">turn 已结束，等 Trigger</text>

        <!-- person / blocked -->
        <rect x="288" y="352" width="192" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="288" y="352" width="192" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="304" y="376" class="d-tag" fill="#5a6580">PERSON</text>
        <text x="304" y="396" class="d-name" fill="#2d3142">Blocked / Failed</text>
        <text x="304" y="416" class="d-sub" fill="#4f5d75">人的消息或 Retry 才放开</text>

        <!-- person / answer -->
        <rect x="512" y="352" width="192" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="512" y="352" width="192" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="528" y="376" class="d-tag" fill="#5a6580">PERSON</text>
        <text x="528" y="396" class="d-name" fill="#2d3142">Awaiting answer</text>
        <text x="528" y="416" class="d-sub" fill="#4f5d75">有一个 Attention</text>

        <!-- person / review -->
        <rect x="736" y="352" width="192" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="736" y="352" width="192" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="752" y="376" class="d-tag" fill="#5a6580">PERSON</text>
        <text x="752" y="396" class="d-name" fill="#2d3142">Awaiting review</text>
        <text x="752" y="416" class="d-sub" fill="#4f5d75">ready 报告 · 带 PR</text>

        <!-- ended -->
        <rect x="1040" y="272" width="192" height="128" rx="8" fill="#f5f5f5"/>
        <rect x="1040" y="272" width="192" height="128" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1.2" fill-opacity="0.05"/>
        <text x="1056" y="298" class="d-tag" fill="#5a6580">CLOSED</text>
        <text x="1056" y="322" class="d-name" fill="#2d3142">Ended</text>
        <text x="1056" y="344" class="d-mono" fill="#4f5d75">completed · closed</text>
        <text x="1056" y="362" class="d-mono" fill="#4f5d75">stopped</text>
        <text x="1056" y="384" class="d-sub" fill="#5a6580">Mandate 保留（stop 除外）</text>

        <!-- annotation -->
        <text x="200" y="470" class="d-annot" fill="#bf4520">面板 Stop 是命令，不是判定：</text>
        <text x="200" y="494" class="d-annot" fill="#5a6580">任意 open 阶段 → Ended，撤销 Mandate，此后不再收消息。</text>

        <!-- ============ legend strip ============ -->
        <line x1="40" y1="644" x2="1240" y2="644" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="668" class="d-tag" fill="#4f5d75" letter-spacing="0.14em">LEGEND</text>
        <circle cx="126" cy="664" r="5" fill="#2d3142"/>
        <text x="140" y="668" class="d-sub" fill="#4f5d75">起点</text>
        <line x1="216" y1="664" x2="244" y2="664" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ticket-state-arrow)"/>
        <text x="252" y="668" class="d-sub" fill="#4f5d75">阶段转移</text>
        <line x1="372" y1="664" x2="400" y2="664" stroke="#5a6580" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="408" y="668" class="d-sub" fill="#4f5d75">恢复：同一 Mandate，不重新 Eval</text>
        <rect x="628" y="658" width="20" height="12" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="656" y="668" class="d-sub" fill="#4f5d75">唯一能动状态的角色</text>
        <text x="1240" y="668" class="d-mono" fill="#5a6580" text-anchor="end">docs/003-execution.md</text>
      </svg>
