<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trust-boundaries-title trust-boundaries-desc" id="trust-boundaries-root">
        <title id="trust-boundaries-title">信任边界：唯一被许可的授权路径与两条被拒绝的旁路</title>
        <desc id="trust-boundaries-desc">架构图：请求只能经 Gate 与 Policy 入口成为 Mandate 后才由 Executor 执行，Executor 以操作者身份推送 GitHub；绕过 Gate 的直接请求被边界拒绝，配置只有本机面板可以写。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #trust-boundaries-root { --color-paper: #f5f5f5; --color-paper-2: #ececec;
      --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #5a6580;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08);
      --color-link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #trust-boundaries-root { font-family: var(--font-sans); color: var(--color-ink); }
      #trust-boundaries-root .container { max-width: 1360px; margin: 0 auto; }
      #trust-boundaries-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #trust-boundaries-root .subtitle { font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 80ch; }
      #trust-boundaries-root .diagram-container { width: 100%;
      overflow-x: auto;
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.25rem; }
      #trust-boundaries-root .d-tag { font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #trust-boundaries-root .d-name { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
      #trust-boundaries-root .d-sub { font-family: var(--font-sans); font-size: 12px; }
      #trust-boundaries-root .d-mono { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; }
      #trust-boundaries-root .d-arrow { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; }
      #trust-boundaries-root .d-label { font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
      #trust-boundaries-root .d-annot { font-family: var(--font-serif); font-style: italic; font-size: 14px; }
      #trust-boundaries-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(45,49,66,0.08); }
      #trust-boundaries-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      #trust-boundaries-root .card-dot.coral { background: var(--color-accent); }
      #trust-boundaries-root .card-dot.muted { background: var(--color-muted); }
      #trust-boundaries-root .card-dot.ink { background: var(--color-ink); }
      @media print {
#trust-boundaries-root .diagram-container { overflow-x: visible; background: transparent; border: 0; padding: 0; }
}</style>
          <marker id="trust-boundaries-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="trust-boundaries-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="trust-boundaries-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- ============ zones ============ -->
        <rect x="40" y="140" width="320" height="440" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="400" y="140" width="440" height="440" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="880" y="140" width="360" height="440" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>

        <!-- ============ paths ============ -->
        <line x1="336" y1="226" x2="424" y2="226" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow)"/>
        <line x1="620" y1="272" x2="620" y2="320" stroke="#bf4520" stroke-width="1.4" marker-end="url(#trust-boundaries-arrow-accent)"/>
        <line x1="620" y1="440" x2="620" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow)"/>
        <path d="M 816,360 H 856 Q 864,360 864,352 V 248 Q 864,240 872,240 H 904"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow)"/>
        <line x1="1060" y1="300" x2="1060" y2="488" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-link)"/>
        <line x1="336" y1="386" x2="424" y2="386" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-link)"/>

        <!-- forbidden: bypass the gate -->
        <path d="M 200,180 V 128 H 380" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4"/>
        <line x1="380" y1="116" x2="380" y2="140" stroke="#bf4520" stroke-width="2"/>
        <text x="392" y="128" class="d-label" fill="#bf4520">无 Gate = 无授权</text>

        <!-- ============ zone labels ============ -->
        <rect x="52" y="134" width="152" height="16" rx="2" fill="#f5f5f5"/>
        <text x="60" y="146" class="d-label" fill="#5a6580">入口 · 身份由 Source 给出</text>
        <rect x="412" y="134" width="164" height="16" rx="2" fill="#f5f5f5"/>
        <text x="420" y="146" class="d-label" fill="#5a6580">编排 · Engine 是唯一写者</text>
        <rect x="892" y="134" width="152" height="16" rx="2" fill="#f5f5f5"/>
        <text x="900" y="146" class="d-label" fill="#5a6580">执行 · 操作者的系统身份</text>

        <!-- ============ path labels ============ -->
        <rect x="352" y="204" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="374" y="216" class="d-label" fill="#4f5d75" text-anchor="middle">请求</text>
        <rect x="628" y="288" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="650" y="300" class="d-arrow" fill="#bf4520" text-anchor="middle">ACCEPT</text>
        <rect x="628" y="456" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="656" y="468" class="d-label" fill="#4f5d75" text-anchor="middle">建工单</text>
        <rect x="792" y="288" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="814" y="300" class="d-label" fill="#4f5d75" text-anchor="middle">派工</text>
        <rect x="1068" y="380" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="1112" y="392" class="d-label" fill="#2e5aa8" text-anchor="middle">gh : push · PR</text>
        <rect x="348" y="364" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="380" y="376" class="d-label" fill="#2e5aa8" text-anchor="middle">本机 HTTP</text>

        <!-- ============ nodes ============ -->
        <rect x="64" y="180" width="272" height="92" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="180" width="272" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="190" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="96" y="199" class="d-tag" fill="#5a6580" text-anchor="middle">SOURCE</text>
        <text x="80" y="222" class="d-name" fill="#2d3142">人 · 请求方</text>
        <text x="80" y="244" class="d-sub" fill="#4f5d75">GitHub · Feishu · 面板提交</text>
        <text x="80" y="262" class="d-mono" fill="#5a6580">actor identity comes from the Source</text>

        <rect x="64" y="340" width="272" height="92" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="340" width="272" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="350" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="96" y="359" class="d-tag" fill="#5a6580" text-anchor="middle">PANEL</text>
        <text x="80" y="382" class="d-name" fill="#2d3142">面板 · 只在本机</text>
        <text x="80" y="404" class="d-sub" fill="#4f5d75">127.0.0.1 + x-orchestrator-request</text>
        <text x="80" y="424" class="d-mono" fill="#5a6580">the only writer of settings</text>

        <rect x="424" y="180" width="392" height="92" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="180" width="392" height="92" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.05" stroke-opacity="0.50"/>
        <rect x="432" y="190" width="44" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="454" y="199" class="d-tag" fill="#bf4520" text-anchor="middle">GATE</text>
        <text x="440" y="222" class="d-name" fill="#2d3142">Gate · Policy</text>
        <text x="440" y="244" class="d-sub" fill="#4f5d75">允许名单 · 准入表 · bot 名单 · accept mode</text>
        <text x="440" y="262" class="d-mono" fill="#5a6580">gives strength; never reads message intent</text>

        <rect x="424" y="320" width="392" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="320" width="392" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="432" y="330" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="456" y="339" class="d-tag" fill="#5a6580" text-anchor="middle">BROKER</text>
        <text x="440" y="362" class="d-name" fill="#2d3142">Engine</text>
        <text x="440" y="384" class="d-sub" fill="#4f5d75">Mandate · Ticket · Assignment · Decision</text>
        <text x="440" y="404" class="d-sub" fill="#5a6580">唯一状态写入者；所有命令都在一个事务里</text>
        <text x="440" y="424" class="d-mono" fill="#5a6580">nothing outside can write these records</text>

        <rect x="424" y="488" width="392" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="488" width="392" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="432" y="498" width="56" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="460" y="507" class="d-tag" fill="#5a6580" text-anchor="middle">MANDATE</text>
        <text x="440" y="530" class="d-name" fill="#2d3142">Ticket · Mandate</text>
        <text x="440" y="552" class="d-sub" fill="#4f5d75">scope · strength · policyVersion · matched rules</text>

        <rect x="904" y="180" width="312" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="904" y="180" width="312" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="912" y="190" width="56" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="940" y="199" class="d-tag" fill="#5a6580" text-anchor="middle">EXECUTOR</text>
        <text x="920" y="222" class="d-name" fill="#2d3142">Executor Session</text>
        <text x="920" y="244" class="d-sub" fill="#4f5d75">danger-full-access · 操作者身份</text>
        <text x="920" y="264" class="d-sub" fill="#5a6580">能按绝对路径绕过任何命令 shim</text>
        <text x="920" y="284" class="d-mono" fill="#5a6580">worker-&lt;ticketId&gt; · 每票一个目录</text>

        <rect x="904" y="340" width="312" height="100" rx="6" fill="#f5f5f5"/>
        <rect x="904" y="340" width="312" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="912" y="350" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="934" y="359" class="d-tag" fill="#5a6580" text-anchor="middle">DISK</text>
        <text x="920" y="382" class="d-name" fill="#2d3142">工单目录</text>
        <text x="920" y="404" class="d-sub" fill="#4f5d75">worktree · prepare · blocked commands</text>
        <text x="920" y="424" class="d-mono" fill="#5a6580">gh / git / lark-cli 永不可屏蔽</text>

        <rect x="904" y="488" width="312" height="84" rx="6" fill="#f5f5f5"/>
        <rect x="904" y="488" width="312" height="84" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="912" y="498" width="60" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="942" y="507" class="d-tag" fill="#5a6580" text-anchor="middle">EXTERNAL</text>
        <text x="920" y="530" class="d-name" fill="#2d3142">GitHub · agent 账号</text>
        <text x="920" y="552" class="d-sub" fill="#4f5d75">每条 chain 自己的 CLI 与账号</text>

        <!-- ============ callout ============ -->
        <text x="64" y="472" class="d-annot" fill="#bf4520">配置只有面板能写：</text>
        <text x="64" y="494" class="d-annot" fill="#5a6580">Agents / Policy / Execution 都是 panel-only，</text>
        <text x="64" y="516" class="d-annot" fill="#5a6580">会话里的工具改不动它们。</text>

        <!-- ============ legend strip ============ -->
        <line x1="40" y1="644" x2="1240" y2="644" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="668" class="d-tag" fill="#4f5d75" letter-spacing="0.14em">LEGEND</text>
        <line x1="112" y1="664" x2="140" y2="664" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow)"/>
        <text x="148" y="668" class="d-sub" fill="#4f5d75">被许可的路径</text>
        <line x1="300" y1="664" x2="328" y2="664" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4"/>
        <line x1="328" y1="656" x2="328" y2="672" stroke="#bf4520" stroke-width="2"/>
        <text x="340" y="668" class="d-sub" fill="#bf4520">被拒绝的旁路</text>
        <rect x="508" y="658" width="20" height="14" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.05" stroke-opacity="0.50"/>
        <text x="536" y="668" class="d-sub" fill="#4f5d75">特权门（唯一授权点）</text>
        <rect x="700" y="658" width="20" height="14" rx="3" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <text x="728" y="668" class="d-sub" fill="#4f5d75">信任边界</text>
        <text x="1240" y="668" class="d-mono" fill="#5a6580" text-anchor="end">docs/002 · 006 · 007</text>
      </svg>
